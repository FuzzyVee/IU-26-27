<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejecución de Pruebas Batería - ET1</title>
	<link rel="stylesheet" href="styles_test.css">

    <script src="./test_app.js"></script>

    <!-- Core classes loading order -->
    <script src="./Core/Validations_Class.js"></script>
    <script src="./Core/Dom_table_Class.js"></script>
    <script src="./Core/Dom_Class.js"></script>
    <script src="./app/persona_Class.js"></script>
    <script src="./app/rol_Class.js"></script>
    <script src="./app/usuario_Class.js"></script>
    <script src="./app/funcionalidad_Class.js"></script>
    <script src="./app/accion_Class.js"></script>


    <!-- Generated test file containing persona_def_tests & persona_pruebas -->
    <script src="./persona_tests.js"></script>
    <script src="./rol_tests.js"></script>
    <script src="./usuario_tests.js"></script>
    <script src="./funcionalidad_tests.js"></script>
    <script src="./accion_tests.js"></script>

</head>

<body>

    <h1>Batería de Pruebas Automáticas - Entidad Persona</h1>
    <a href="../index.html">← Volver al Formulario Principal</a>
    <br><br>

       
    <label for="entidadSelect">Seleccionar entidad:</label>
    <select id="entidadSelect">
        <option value="persona">persona</option>
        <option value="usuario">usuario</option>
        <option value="rol">rol</option>
        <option value="accion">accion</option>
        <option value="funcionalidad">funcionalidad</option>
        <option value="all">all</option>
    </select>

    <button type="button" onclick="runAllTests()">Ejecutar Todas las Pruebas</button>

    <div id="hidden-form-container">
        <section id="IU_form">
            <input type="text" id="dni">
            <span id="span_error_dni"><span id="error_dni"></span></span>

            <input type="text" id="nombre_persona">
            <span id="span_error_nombre_persona"><span id="error_nombre_persona"></span></span>

            <input type="text" id="apellidos_persona">
            <span id="span_error_apellidos_persona"><span id="error_apellidos_persona"></span></span>

            <input type="text" id="fechaNacimiento_persona">
            <span id="span_error_fechaNacimiento_persona"><span id="error_fechaNacimiento_persona"></span></span>

            <input type="text" id="direccion_persona">
            <span id="span_error_direccion_persona"><span id="error_direccion_persona"></span></span>

            <input type="text" id="telefono_persona">
            <span id="span_error_telefono_persona"><span id="error_telefono_persona"></span></span>

            <input type="email" id="email_persona">
            <span id="span_error_email_persona"><span id="error_email_persona"></span></span>

            <input type="file" id="foto_persona">
            <span id="span_error_foto_persona"><span id="error_foto_persona"></span></span>

            <button id="submit_button"></button>
        </section>
        <section id="">
    </div>

    <!-- Results Table -->
    <table id="results-table">
        <thead>
            <tr>
                <th>Prueba </th>
                <th>Campo</th>
                <th>Acción</th>
                <th>Valor Probado</th>
                <th>Resultado Esperado</th>
                <th>Resultado Obtenido</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody id="results-body">
            <tr>
                <td colspan="7">Haz clic en "Ejecutar Todas las Pruebas" para iniciar el test.</td>
            </tr>
        </tbody>
    </table>    

</body>

</html>
